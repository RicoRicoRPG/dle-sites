name: Daily puzzles and deploy

# 00:20 UTC: close yesterday's Steam polling, freeze puzzles for yesterday..tomorrow, build both
# sites, test them, commit the new data, and deploy to Cloudflare Pages.
# Also runs on every push to main, so a config change (AdSense ids, copy) goes live right away.
on:
  schedule:
    - cron: "20 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peakdle-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore polling state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: peakdle-state-${{ github.run_id }}
          restore-keys: peakdle-state-
      - name: Close finished Steam days
        run: node scripts/peakdle-close.mjs
      - name: Freeze puzzles
        run: node scripts/puzzles.mjs
      - name: Test
        run: node test/check.mjs
      - name: Build
        run: node scripts/build.mjs
      - name: Check the build
        run: node test/check.mjs --dist
      - name: Commit new data
        run: |
          git config user.name "dle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Daily data $(date -u +%F)"
            git pull --rebase
            git push
          fi
      - name: Deploy Speedrundle
        run: npx --yes wrangler@4 pages deploy dist/speedrundle --project-name="$(node -p "require('./sites/speedrundle/site.json').cloudflareProject")" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Peakdle
        run: npx --yes wrangler@4 pages deploy dist/peakdle --project-name="$(node -p "require('./sites/peakdle/site.json').cloudflareProject")" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
